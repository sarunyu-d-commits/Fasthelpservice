<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ออฟไลน์ — FastHelp</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f6f8fb;
        color: #0f172a;
      }
      main {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .icon {
        font-size: 40px;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #64748b;
        line-height: 1.6;
        font-size: 15px;
      }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        background: #0d9488;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">📡</div>
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>
        กรุณาตรวจสอบสัญญาณเครือข่ายแล้วลองใหม่อีกครั้ง
        หน้าที่เคยเปิดไว้ยังใช้งานได้ตามปกติ
      </p>
      <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </main>
  </body>
</html>
